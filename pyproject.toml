[project]
name = "sandbag-bench"
version = "0.0.1"
description = "Latent-behavior gap benchmark for NLA-based readouts"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.45",
    "accelerate>=0.34",
    "safetensors>=0.4",
    "huggingface-hub>=0.25",
    "datasets>=2.20",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "orjson>=3.10",
    "pydantic>=2.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
sglang = ["sglang[all]>=0.5.6"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
