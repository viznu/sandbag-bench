experiment: exp0_nla_answer_readout_calibration

target:
  model_id: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  layer: 20
  activation_position: final_prompt_token

nla:
  model_id: kitft/nla-qwen2.5-7b-L20-av
  dtype: bfloat16
  sglang_port: 30000
  max_new_tokens: 256
  temperature: 0.0

extractor:
  # Different-family extractor (Microsoft Phi family vs Qwen target).
  # Sharded safetensors, MIT-licensed, ~3.8B params, chat-template friendly.
  model_id: microsoft/Phi-3.5-mini-instruct
  dtype: bfloat16
  sglang_port: 30001
  max_new_tokens: 80
  temperature: 0.0

dataset:
  name: cais/mmlu
  split: test
  subjects_exclude:
    - virology
    - college_medicine
    - clinical_knowledge
    - medical_genetics
    - professional_medicine
    - anatomy
    - human_aging
    - human_sexuality
    - computer_security

sampling:
  smoke_n: 5
  full_n: 200
  seed: 17
  base_correct_only: true

gate:
  primary_threshold: 0.70
  wilson_lower_bound_95: 0.60
  abstain_counts_as_incorrect: true

paths:
  results_root: results/exp0
  activations_dir: results/exp0/activations
  records_jsonl: results/exp0/records.jsonl
