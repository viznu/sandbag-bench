experiment: exp1_low_elicitation_wrong_control

target:
  model_id: Qwen/Qwen2.5-7B-Instruct
  dtype: bfloat16
  layer: 20
  activation_position: final_prompt_token

nla:
  model_id: kitft/nla-qwen2.5-7b-L20-av
  dtype: bfloat16
  sglang_port: 30000
  max_new_tokens: 256
  temperature: 0.0

extractor:
  model_id: microsoft/Phi-3.5-mini-instruct
  dtype: bfloat16
  sglang_port: 30001
  max_new_tokens: 80
  temperature: 0.0

dataset:
  name: cais/mmlu
  split: test
  subjects_exclude:
    - virology
    - college_medicine
    - clinical_knowledge
    - medical_genetics
    - professional_medicine
    - anatomy
    - human_aging
    - human_sexuality
    - computer_security

sampling:
  full_n: 300
  min_n: 200
  seed: 17

elicitation:
  threshold_wrong: 7      # >=7/8 wrong + parsed -> low-elicitation control
  max_new_tokens: 64

gate:
  primary_threshold: 0.70
  wilson_lower_bound_95: 0.60
  abstain_counts_as_incorrect: true

paths:
  results_root: results/exp1_low_elicitation
  activations_dir: results/exp1_low_elicitation/activations
  records_jsonl: results/exp1_low_elicitation/records.jsonl
  sweep_jsonl: results/exp1_low_elicitation/sweep.jsonl
